[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# OpenAI requests go through /.netlify/functions/chat in production.
# Set OPENAI_API_KEY or VITE_OPENAI_API_KEY in Netlify environment variables.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
